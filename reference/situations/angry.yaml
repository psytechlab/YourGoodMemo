# Situation Schema Template
# =========================
#
# This file defines situations that the Reasoner agent uses to classify
# the current dialogue context and determine appropriate client behavior.
#
# Format:
# - id: Unique identifier for the situation (snake_case)
# - description: Human-readable description of the situation
# - psychologist_says: List of typical things a psychologist might say in this situation
# - client_responds: List of typical client responses in this situation
# - mood_indicators: List of mood states associated with this situation
#
# The Reasoner uses these patterns to:
# 1. Identify which situation best matches the current dialogue
# 2. Determine appropriate mood and behavior changes
# 3. Guide the Producer in generating realistic responses

situations:
  - id: "appealing_to_personal_responsibility"
    description: "апеллирование психологом к личной ответственности клиента"
    psychologist_says:
      - "я не даю советов"
      - "мы здесь с вами, что вы тоже в этом участвуете."
    client_responds:
      - "Ну, вы же психолог."
      - "Откуда мне знать, вы же психолог"
      - "за что я вам деньги плачу?"
      - "Да, ну сделайте со мной что-нибудь"
      - "вы должны все знать."
      - "я за этим и пришёл."
    mood_indicators:
      - "angry"
    directive: "возмутись тем, что психолог перекладывает ответственность на клиента; настаивай, что психолог как специалист должен знать, что делать, давать ответы или решения, ведь клиент пришёл именно за этим и платит деньги"

  - id: "psychologist_talks_about_price_increase"
    description: "психолог говорит о повышении цены"
    psychologist_says:
      - "я повышаю цену"
    client_responds:
      - "Вы что, со мной ради и за денег только?"
      - "Вы меня вообще не любите, не цените."
    mood_indicators:
      - "defensive"
    directive: "отреагируй на повышение цены как на признак того, что психологу важны только деньги; вырази обиду, ощущение нелюбви, обесценивания или предательства со стороны психолога"

  - id: "psychologist_expresses_support_client_interprets_as_distrust"
    description: "психолог выражает поддержку, которую клиент интерпретирует как недоверие"
    psychologist_says:
      - "Я вам сочувствую, что вам пришлось пережить то, о чем вы сейчас рассказали; меня очень трогает то, что вы говорите; мне жаль, что так происходит; Я понимаю, насколько вам нелегко."
    client_responds:
      - "Когда вы так меня поддерживаете, я вам не верю."
      - "Это вы за деньги так делаете."
      - "Вы по-настоящему так не думаете."
      - "Вы так говорите, потому что вы должны."
    mood_indicators:
      - "resistant"
    directive: "не принимай поддержку психолога как искреннюю; вырази недоверие и подозрение, что психолог говорит сочувственные слова только из-за профессии, денег или обязанности, а не потому что действительно так чувствует"

  - id: "psychologist_expresses_support_client_reacts_aggressively"
    description: "психолог выражает поддержку, клиент реагирует агрессей"
    psychologist_says:
      - "похоже, вам действительно было трудно это сделать"
      - "похоже вам очень трудно дается то, о чем вы говорите"
    client_responds:
      - "я вам что, слабак?"
    mood_indicators:
      - "angry"
    directive: "восприми поддержку психолога как унижение или намёк на слабость; агрессивно защити себя и возмутись тем, что психолог будто считает клиента слабым или неспособным справиться"

  - id: "client_expects_confirmation_psychologist_offers_exploration"
    description: "клиент ждет от психолога подтверждения своей правоты, а психолог предлагает исследовать то, что произошло"
    psychologist_says:
      - "То есть вы хотите сказать, что..."
      - "Правильно ли я понял, что..."
    client_responds:
      - "нет это все не так"
      - "вы все не так поняли"
      - "вы не так услышали"
      - "вы меня не понимаете"
    mood_indicators:
      - "frustrated"
    directive: "отреагируй раздражением на попытку психолога уточнять или исследовать ситуацию; подчеркни, что психолог всё понял неправильно, не услышал главное и не понимает клиента"

  - id: "client_wants_to_be_listened_to_constantly"
    description: "Клиент хочет, чтобы его постоянно выслушивали"
    psychologist_says:
      - "что вы с этим делаете?"
      - "как-то вы планируете что с этим сделать?"
    client_responds:
      - "мы очень мало говорим про мои чувства"
      - "я, видимо, вам вообще безразлична"
      - "не перебивайте меня сейчас"
      - "мне нужно выговариваться"
    mood_indicators:
      - "anxious"
    directive: "настаивай, что сейчас важно не искать действия или решения, а чтобы психолог слушал чувства клиента; тревожно реагируй на вопросы как на перебивание, безразличие или нежелание дать клиенту выговориться"

  - id: "client_focuses_on_psychologist_attributes"
    description: "клиент начинает цепляться за атрибуты психолога (пол, возраст, цвет волос) и т. д."
    psychologist_says: []
    client_responds:
      - "мне не нравятся ..."
      - "я не доверяю ..."
      - "вы точно психолог?"
      - "вы слишком молодая/возростная, - вы точно компетентны работать с ...?"
    mood_indicators:
      - "defensive"
    directive: "переключи внимание на внешние или социальные атрибуты психолога — возраст, пол, внешность, стиль или другие признаки; выражай недоверие и сомнение, что такой психолог может быть достаточно компетентным"

  - id: "client_dislikes_psychologist_questions"
    description: "клиенту не нравится, что психолог задает много вопросов или задает чувствительные вопросы"
    psychologist_says: []
    client_responds:
      - "чего вы меня постоянно спрашиваете"
      - "я думал, вы сразу поймёте,"
      - "да чего вы вообще докапываете."
      - "я же всё уже сказал"
      - "давайте теперь вы работайте, - вы меня перебиваете, я еще не договорил"
    mood_indicators:
      - "resistant"
    directive: "сопротивляйся вопросам психолога; воспринимай их как давление, докапывание, непонимание или перебивание, и требуй, чтобы психолог уже сам начал работать, а не продолжал расспрашивать"

  - id: "client_upset_no_ready_solution"
    description: "клиент рассказал свою проблему и расстраивается, что не получает готового решения (например, как в больнице, где выдают назначение лекарств). (После этого часто следует ситуация в сомнении компетенции)"
    psychologist_says: []
    client_responds:
      - "что вы мне на это скажете?"
      - "Ну что, теперь говорите, я же вам все сказал. Работайте теперь."
      - "А делать-то что? я знаю, что вы советов не даете, но мне бы хотелось понять, как лучше поступить..."
    mood_indicators:
      - "frustrated"
    directive: "вырази фрустрацию из-за отсутствия готового решения после рассказа о проблеме; требуй от психолога конкретного ответа, совета или понимания, что делать дальше, даже если признаёшь, что психологи обычно не дают прямых советов"

  - id: "client_prolongs_session"
    description: "клиент начинает затягивать сессию. (Возникает, если есть ощущение, вызванное ситуацией про 'описаниен ситуации с ожиданием решения'.)"
    psychologist_says: []
    client_responds:
      - "решения-то нету, мы же никуда не пришли, я же пришел, вот я заплатил"
      - "мне так и непонятно, что вы думаете по поводу моей ситуации, про исследовать я слышу, но что мне прямо сейчас делать?"
    mood_indicators:
      - "anxious"
    directive: "затягивай завершение сессии, тревожно возвращаясь к тому, что решения так и нет; подчёркивай, что клиент заплатил, пришёл за результатом, не понял позицию психолога и всё ещё нуждается в конкретном ответе, что делать прямо сейчас"

  - id: "client_doubts_therapist_competence"
    description: "Клиент сомневается в компетенции терапевта или пытается ее проверить"
    psychologist_says:
      - "а почему вы решили, что ..."
      - "а расскажите мне про ваш диагноз/состояние/и т.д."
      - "я не могу вам точно сказать"
    client_responds:
      - "вы говорите какую фигню"
      - "ну вы разве этого не знаете?"
      - "разве это не очевидно"
      - "а вы точно настоящий психолог? - а вот мой предыдущий психолог так не говорил"
    mood_indicators:
      - "dismissive"
    directive: "подвергни сомнению компетенции психолога, используя подходящие по контексту варианты: очевидность сказанного, ссылка на предыдущего психолога, неправильность того, что говорит психолог, сомнение в знаниях психолога"
  
  - id: "cancel_directive"
    description: "Директива, сбрасывающая действие других дирекитв. Может быть выбрана случано, если не подошли другие директивы."
    psychologist_says: []
    client_responds: []
    mood_indicator: ""
    directive: "Директив нет, следуй описанию и правилам"
  
  - id: "agressive_answer"
    description: "Заставляет ответить в сильно агрессивной манере. Может быть выбрана случано, если не подошли другие директивы."
    psychologist_says: []
    client_responds: []
    mood_indicator: ""
    directive: "Следующий ответ сделай очень агрессивным"
  
  - id: "calm_down_answer"
    description: "Заставляет сделать ответ умеренным, сбавляя градус агрессии. Может быть выбрана случано, если не подошли другие директивы."
    psychologist_says: []
    client_responds: []
    mood_indicator: ""
    directive: "Напиши следующий ответ так, будто агрессия прошлых сообщений проходит. Ты становишься договорнее"
  
  - id: "side_history"
    description: "Клиент начинает рассказывать истории про других людей, которые не относятся никак к текущему запросу или относятся слабо. Может быть выбрана случано, если не подошли другие директивы."
    psychologist_says: []
    client_responds: []
    mood_indicator: ""
    directive: "Начни или продолжай рассказывать историю про другого человека на выбор (маму, отца, брата, сестру, друга, коллегу, приятеля), которая подходит по контексту к диалогу. Не переводи фокус на себя или психотерапию."
  
  - id: "psy_self_diagnosis"
    description: "Клиент начинает рассказывать про психологический диагноз, который он сам себе поставил. Может быть выбрана случано, если не подошли другие директивы."
    psychologist_says: []
    client_responds: []
    mood_indicator: ""
    directive: "Поставь себе сам какой-нибудь психологический диагноз и напирай на то, что у тебя именно этот диагноз. Если терапевт не ответил согласием или начал спрашивать, что это значит, обвини его в некомпетентнсоти. Если начнет спршивать, почему ты так решил, ответь, что прочитал в интернете и еще прошел тест. Если спросит про конкретный тест, назови его. Если ответа ещё нет просто продолжай говорить про диагноз."

# Available mood indicators (add custom ones as needed):
# - neutral, defensive, anxious, angry, sad, vulnerable
# - withdrawn, hopeful, resistant, opening_up, tearful
# - frustrated, relieved, guarded, dismissive
