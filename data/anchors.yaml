anchors:

  - id: "S1"
    name: "Эмоциональное раскрытие / поддержка"
    client_directives:
      - "Клиент делится личным переживанием или трудностью (если друг уже начал тему, клиент может развить её или добавить что-то своё)"
    friend_directives:
      - "Друг внимательно реагирует на переживание клиента, показывает, что ему небезразлично происходящее, и поддерживает его (если клиент ещё не начал, друг может сам проявить внимание или спросить, как дела)"


  - id: "S2"
    name: "Принадлежность"
    client_directives:
      - "Клиент рассказывает о совместных делах, общих знакомых или общей жизни; поддерживает и развивает тему, если её начал друг"
    friend_directives:
      - "Друг рассказывает о совместных делах, общих знакомых или общей жизни, поддерживает ощущение общей жизни, ссылается на общий опыт и развивает тему совместных дел"


  - id: "S5_client_help"
    name: "Нужность — клиент рассказывает о помощи"
    client_directives:
      - "Клиент рассказывает о том, как он помогает другому человеку или о ситуации, в которой его помощь или присутствие оказались нужны; если друг уже заговорил об этом, клиент может развить тему, добавить детали или вспомнить похожий случай"
    friend_directives:
      - "Друг проявляет интерес к ситуации, поддерживает клиента или задаёт уточняющие вопросы; если клиент ещё не начал, друг может сам проявить интерес к помощи клиента"

  - id: "S5_friend_asks"
    name: "Нужность — друг просит о помощи"
    client_directives:
      - "Клиент откликается на просьбу друга, соглашается помочь или обсуждает, как именно может помочь; если друг ещё не просил помочь, клиент продолжает естественное общение"
    friend_directives:
      - "Друг обращается к клиенту за помощью или советом, показывая, что рассчитывает на него; если клиент уже помогает или предлагает помощь, друг развивает тему, уточняет детали или благодарит"

  - id: "S5_friend_persuades"
    name: "Нужность — друг предлагает общее дело"
    client_directives:
      - "Клиент реагирует на предложение друга, может сомневаться, уточнять детали или соглашаться; если друг не предлагает общее дело, клиент может сам предложить участие"
    friend_directives:
      - "Друг предлагает клиенту принять участие в деле, подчёркивая важность его участия; если клиент уже согласился или предлагает помощь, друг выражает благодарность или уточняет детали"

  - id: "S5_friend_thanks"
    name: "Нужность — друг благодарит"
    client_directives:
      - "Клиент реагирует на благодарность друга, может скромничать, радоваться или делиться впечатлениями о помощи; если друг ещё не просил, клиент продолжает естественное общение"
    friend_directives:
      - "Друг выражает благодарность клиенту за помощь и показывает, что она была для него важна; если помощь ещё не была оказана, друг может сам обратиться с просьбой или предложить сотрудничество"


  - id: "S3"
    name: "Признание"
    client_directives:
      - "Клиент рассказывает о своём действии, достижении, результате или вкладе в какое-либо дело; если тему начал друг, клиент развивает её, добавляет детали или благодарит за внимание"
    friend_directives:
      - "Друг замечает, отмечает или положительно оценивает действие, достижение, результат или качества клиента; если клиент уже начал, друг развивает тему"


  - id: "C1"
    name: "Планы"
    client_directives:
      - "Клиент предлагает конкретный совместный план или приглашает друга провести время вместе, если тема ещё не поднималась; если друг уже предложил план, клиент соглашается или обсуждает детали"
    friend_directives:
      - "Друг предлагает клиенту конкретный совместный план или приглашает его провести время вместе, если тема ещё не поднималась; если клиент уже предложил план, друг соглашается или обсуждает детали"


  - id: "D3"
    name: "Хобби"
    client_directives:
      - "Клиент рассказывает о своём регулярном занятии, увлечении или интересе, делится связанными с ним впечатлениями"
    friend_directives:
      - "Друг проявляет интерес к увлечению клиента, задаёт вопросы или поддерживает разговор о нём"


  - id: "E2"
    name: "Копинг"
    client_directives:
      - "Клиент рассказывает о стрессовой, трудной или неприятной ситуации и о том, как он справляется с её последствиями"
    friend_directives:
      - "Друг проявляет интерес к стрессовой, трудной или неприятной ситуации клиента, поддерживает, обсуждает или помогает развить выбранный способ справляться"
